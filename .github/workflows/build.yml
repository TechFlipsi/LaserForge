name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bau:
    name: Windows-Bau + Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wiederherstellen
        run: dotnet restore LaserForge.sln

      - name: Bauen
        run: dotnet build LaserForge.sln -c Release --no-restore

      - name: Testen
        run: dotnet test tests/LaserForge.Tests/LaserForge.Tests.csproj -c Release --no-build -v q
